name: dj_king
description: "A five-round multiplayer music battle for a Flutter class project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_database: ^13.0.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  wakelock_plus: ^1.8.2
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
